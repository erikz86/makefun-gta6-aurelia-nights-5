<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurelia Nights V</title><style>html,body{margin:0;background:#07121d;color:#d9f1ff;font:14px system-ui;overflow:hidden}#game{display:block;width:100vw;height:100vh}#mini{position:fixed;right:18px;top:18px;width:180px;height:120px;border:2px solid #8bd8dc;background:#081522cc}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#071522cc;border:1px solid #3a8190;padding:10px;box-shadow:0 0 20px #03101a}.top{position:absolute;left:18px;top:18px}.mission{position:absolute;left:18px;bottom:18px;max-width:360px}.title{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#15384b,#050b13 70%);text-align:center}.title h1{font-size:clamp(38px,7vw,82px);letter-spacing:.08em;color:#ffd27d;text-shadow:0 4px #7a3d50}.title button{font:inherit;background:#e5a756;border:0;padding:12px 30px;margin:12px;cursor:pointer}.hidden{display:none}</style></head><body><canvas id="game"></canvas><canvas id="mini"></canvas><div id="hud"><div class="panel top" id="stats"></div><div class="panel mission" id="objective"></div><div class="title" id="title"><div><h1>AURELIA<br>NIGHTS V</h1><p>Coastal city. Long shadows. Your move.</p><button id="start">START NIGHT</button><button id="continue">CONTINUE</button><p>WASD move/drive · E enter car · F strike · Click fire · M mute · Esc pause</p></div></div></div><script type="module" src="./src/main.js"></script></body></html>
